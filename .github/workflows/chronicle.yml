name: chronicle

on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read

concurrency:
  group: asteria-turn        # ターン処理と直列化する(セーブを同時に触らない)
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema Pillow numpy
      - name: Rebuild past chapters from issue replies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m engine.cli --backfill-chronicle --repo "$GITHUB_REPOSITORY"
      - name: Commit restored chapters
        run: |
          git config user.name "rpg-engine[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add save/chronicle
          if git diff --cached --quiet; then
            echo "復元すべき章はありませんでした"
          else
            git commit -m "chore: restore past chronicle chapters from issue replies"
            git push
          fi
