name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest jsonschema Pillow numpy
      - run: python -m pytest -q
      - name: CLI smoke (fresh save, dry run)
        # ライブのセーブ状態(CT等)に依存しないよう、一時セーブで実行する
        run: |
          python -m engine.cli --reset --save /tmp/ci-save --repo smoke/smoke
          python -m engine.cli --input fixtures/turn.json --save /tmp/ci-save --mock
