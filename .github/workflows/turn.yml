name: turn

on:
  issues:
    types: [opened]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: asteria-turn
  cancel-in-progress: false

jobs:
  turn:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
       (startsWith(github.event.issue.title, '[TURN]') ||
        startsWith(github.event.issue.title, '[GENERATE]') ||
        startsWith(github.event.issue.title, '[UPDATE]')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # issuesイベントのgithub.shaは「Issue作成時点」のSHAに固定されるため、
          # 待機後に実行されるrunでも必ずブランチの最新先端をチェックアウトする
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Install Claude Code CLI (subscription auth)
        # CLAUDE_CODE_OAUTH_TOKEN が未設定でもゲームは止めない(ルール層フォールバック)
        if: ${{ github.event_name == 'issues' }}
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            npm install -g @anthropic-ai/claude-code
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN 未設定: AI生成はルール層フォールバックで動作します"
          fi
      - name: Resolve issue
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python -m engine.turn_runner --event-path "$GITHUB_EVENT_PATH"
      - name: Smoke run (manual dispatch, dry run)
        if: github.event_name == 'workflow_dispatch'
        run: python -m engine.cli --input fixtures/turn.json --mock
